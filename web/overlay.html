<!--

                   puis s'arrête à droite (0 = il fait des allers-retours)
    taux=50        coût horaire moyen par personne
    devise=EUR     devise (EUR, USD, CHF…)
    auto=1         démarre le chrono tout de suite (mode sans serveur)
    seuils=50,200,500,1000   paliers de colère de M. Krabs
    vitesse=110    vitesse de Gary en allers-retours (duree=0), pixels/seconde
    piece=1        une pièce s'envole tous les X de la devise (0 = aucune)
    krabs=haut-droite   haut-droite | haut-gauche | bas-droite | bas-gauche | cache
    echelle=1      taille globale
    gary_regarde=gauche  sens de l'image assets/gary.* (gauche ou droite)
  Clavier (clic droit sur la source > Interagir) : Espace = pause, +/- = participants, R = remise à zéro.
-->

  <div id="coins"></div>

<script src="common.js"></script>
<script>
const meeting = new Meeting();
const scale = +param("echelle", 1);
const speed = +param("vitesse", 110) * scale;
const coinStep = +param("piece", 1);
let thresholds = param("seuils", "").split(",").map(Number).filter((x) => x > 0);

document.documentElement.style.setProperty("--scale", scale);
const krabsPos = param("krabs", "haut-droite");
const krabsEl = document.getElementById("krabs");
if (krabsPos === "cache") krabsEl.hidden = true;
else krabsEl.classList.add(...krabsPos.split("-"));

const PHRASES = [
  "Ah, une réunion… Tout va bien, moussaillons.",
  "Hmm… ça commence à chiffrer, tout ça.",
  "Chaque minute me coûte, moussaillons !",
  "MON ARGENT !!! Abrégez !",
  "FAILLITE !!! TOUT LE MONDE DEHORS !!!",
];

// --- Images personnalisées (facultatif) -----------------------------------------
// web/assets/gary.gif|png|webp et web/assets/krabs-0..4.png|gif|webp remplacent les dessins.
async function loadCustomImages() {
  let available = null; // en mode serveur on connaît la liste, ce qui évite des requêtes inutiles
  if (SERVER) { try { available = new Set((await api("/api/config")).assets); } catch {} }
  const tryImage_ = (src) => (available && !available.has(src.slice(7)) ? null : tryImage(src));
  for (const ext of ["gif", "webp", "png"]) {
    const img = await tryImage_(`assets/gary.${ext}`);
    if (img) {
      const sprite = document.getElementById("garySprite");
      sprite.replaceChildren(img);
      if (param("gary_regarde", "gauche") === "gauche") sprite.classList.add("faces-left");
      break;
    }
  }
  const krabsImgs = [];
  for (let lvl = 0; lvl <= 4; lvl++) {
    for (const ext of ["gif", "webp", "png"]) {
      const img = await tryImage_(`assets/krabs-${lvl}.${ext}`);
      if (img) { krabsImgs[lvl] = img; break; }
    }
  }
  if (krabsImgs.some(Boolean)) {
    const sprite = document.getElementById("krabsSprite");
    sprite.classList.add("custom");
    krabsImgs.forEach((img, lvl) => { if (img) { img.dataset.level = lvl; sprite.appendChild(img); } });
    // Paliers sans image : on réutilise l'image du palier précédent.
    for (let lvl = 0; lvl <= 4; lvl++) {
      if (!krabsImgs[lvl]) {
        const prev = krabsImgs.slice(0, lvl).reverse().find(Boolean) || krabsImgs.find(Boolean);
        const clone = prev.cloneNode();
        clone.dataset.level = lvl;
        sprite.appendChild(clone);
      }
    }
    sprite.querySelector("svg").remove();
  }
}

// --- Gary ------------------------------------------------------------------------
const gary = document.getElementById("gary");
let x = 40, dir = 1, last = performance.now();

function moveGary(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  const max = window.innerWidth - gary.offsetWidth - 20;
  const progress = meeting.progress;
  let moving = meeting.s.running;
  if (progress !== null) {
    // Durée prévue : la position suit l'avancement de la réunion, arrêt à droite à la fin.
    x = 20 + Math.min(1, progress) * (max - 20);
    dir = 1;
    moving = moving && progress < 1;
  } else if (moving) {
    x += dir * speed * dt;
    if (x > max) { x = max; dir = -1; }
    if (x < 20) { x = 20; dir = 1; }
  }
  gary.style.transform = `translateX(${x}px)`;
  gary.classList.toggle("left", dir < 0);
  gary.classList.toggle("stopped", !moving); // Gary immobile (pause ou arrivé au bout)
  gary.classList.toggle("paused", !meeting.s.running); // chrono en pause
  gary.classList.toggle("over", progress !== null && progress >= 1);
}

// --- Pièces qui s'envolent ---------------------------------------------------------
let lastCoin = 0, lastCoinAt = 0;
function coins(cost) {
  if (coinStep <= 0) return;
  const step = Math.floor(cost / coinStep);
  if (step < lastCoin) lastCoin = step; // remise à zéro
  const now = performance.now();
  if (step > lastCoin && now - lastCoinAt > 180) {
    lastCoin = step;
    lastCoinAt = now;
    const c = document.createElement("div");
    c.className = "coin";
    c.textContent = "🪙";
    const box = gary.getBoundingClientRect();
    c.style.left = box.left + box.width / 2 + (Math.random() * 60 - 30) + "px";
    c.style.top = box.top + "px";
    document.getElementById("coins").appendChild(c);
    setTimeout(() => c.remove(), 2500);
  }
}

// --- Krabs -------------------------------------------------------------------------
let level = -1;
function krabs(cost) {
  const t = thresholds.length ? thresholds : [50, 200, 500, 1000];
  let lvl = 0;
  while (lvl < 4 && cost >= t[lvl]) lvl++;
  if (lvl !== level) {
    level = lvl;
    krabsEl.dataset.level = lvl;
    krabsEl.classList.remove("bump");
    void krabsEl.offsetWidth; // relance l'animation
    krabsEl.classList.add("bump");
    const speech = document.getElementById("speech");
    speech.textContent = PHRASES[lvl];
    speech.classList.remove("show");
    void speech.offsetWidth;
    speech.classList.add("show");
  }
}

// --- Boucle principale -------------------------------------------------------------
const priceEl = document.getElementById("price");
const metaEl = document.getElementById("meta");
const timeEl = document.getElementById("time");
let lastMeta = "", lastTime = "", lastUnit = 0;

function frame(now) {
  moveGary(now);
  const cost = meeting.cost;
  const cur = meeting.s.currency;
  priceEl.textContent = money(cost, cur);
  // Petit sursaut du chiffre à chaque unité de devise dépensée
  const unit = Math.floor(cost);
  if (unit > lastUnit) { priceEl.classList.remove("tick"); void priceEl.offsetWidth; priceEl.classList.add("tick"); }
  lastUnit = unit;
  const time = timeText(meeting);
  if (time !== lastTime) { timeEl.textContent = time; lastTime = time; }
  const meta = `${meeting.s.participants} pers. à ${money(meeting.s.rate, cur)}/h`;
  if (meta !== lastMeta) { metaEl.textContent = meta; lastMeta = meta; }
  coins(cost);
  krabs(cost);
  requestAnimationFrame(frame);
}

async function init() {
  await loadCustomImages();
  if (SERVER && !thresholds.length) {
    try { thresholds = (await api("/api/config")).krabs_thresholds; } catch {}
  }
  connect({ meeting: (m) => meeting.set(m) });
  meetingKeys(meeting);
  requestAnimationFrame(frame);
}
init();
</script>
</body>
</html>
